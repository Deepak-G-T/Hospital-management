<div class="pager" data-pager hidden role="navigation" aria-label="Pagination">
  <span aria-live="polite"><span class="hide-phone">Page </span><span data-pager-page></span><span class="hide-phone" data-pager-total></span></span>
  <div class="row" style="--gap:0.375rem">
    <button type="button" class="btn btn-secondary btn-sm" data-pager-prev aria-label="Previous page"><svg class="icon icon-sm"><use href="#i-chevron-left" /></svg><span class="hide-phone">Prev</span></button>
    <button type="button" class="btn btn-secondary btn-sm" data-pager-next aria-label="Next page"><span class="hide-phone">Next</span><svg class="icon icon-sm"><use href="#i-chevron-right" /></svg></button>
  </div>
</div>
