<!-- Date range presets + custom dates. Used inside <div class="card range-bar" data-range>. Logic: src/js/core/range.js -->
<div class="field">
  <span class="label">Range</span>
  <div class="tabs tabs-sm" data-presets aria-label="Date range presets">
    <button class="tab" data-value="7">7D</button><button class="tab" data-value="30">30D</button><button class="tab" data-value="90">90D</button><button class="tab" data-value="365">1Y</button>
  </div>
</div>
<div class="date-pair">
  <div class="field"><label class="label">From</label><input class="input input-sm" type="date" name="from" aria-label="From date" /></div>
  <div class="field"><label class="label">To</label><input class="input input-sm" type="date" name="to" aria-label="To date" /></div>
</div>
