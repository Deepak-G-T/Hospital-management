<!doctype html>
<html lang="en">
<head>
  <!-- @include head.html -->
  <title>My patients · MediCore</title>
</head>
<body data-title="Patients" data-roles="DOCTOR">
<!-- @include portal-start.html -->
<div class="page-header"><div><h1>My patients</h1><p>Patients you have a care relationship with (appointments, emergencies or referrals)</p></div></div>
<div class="input-wrap mb-4" style="max-width:28rem"><svg class="icon icon-sm"><use href="#i-search" /></svg><input class="input" type="search" id="search" name="search" placeholder="Search patients…" aria-label="Search patients" /></div>
<div data-state="loading" id="patients" data-source="/doctor/patients" data-template="tpl-patient" data-filters="#search" data-limit="12">
  <!-- @include load-states.html -->
  <div class="when-empty card"><div class="empty"><span class="empty-icon"><svg class="icon icon-lg"><use href="#i-clipboard-list" /></svg></span><p class="empty-title">No patients yet</p></div></div>
  <div class="when-ready grid sm-grid-2 xl-grid-3 stagger is-grid" data-list></div>
  <!-- @include pager.html -->
</div>
<template id="tpl-patient">
  <a class="card card-hover card-pad row row-nowrap items-start" style="--gap:1rem" data-attr="href:/doctor/patients/{id}">
    <span class="avatar avatar-lg" data-initials="fullName"></span>
    <span class="grow">
      <span class="truncate strong" style="display:block" data-text="fullName"></span>
      <span class="xsmall muted" style="display:block"><span data-text="{dateOfBirth|age} yrs · {gender|enum}"></span><span data-if="bloodGroup" data-text=" · {bloodGroup|blood}"></span></span>
      <span class="row xsmall muted mt-2" style="--gap:0.375rem" data-if="appointments"><span data-text="Last visit {appointments.0.startAt|date}"></span><span data-badge="appointments.0.status"></span></span>
      <span class="row xsmall text-red mt-1" style="--gap:0.25rem;font-weight:500" data-if="_count.allergies>0"><svg class="icon icon-sm"><use href="#i-alert-triangle" /></svg><span data-text="{_count.allergies} known allergy/allergies"></span></span>
    </span>
  </a>
</template>
<!-- @include portal-end.html -->
<script type="module" src="/src/js/portal.js"></script>
</body>
</html>
