<!doctype html>
<html lang="en">
<head>
  <!-- @include head.html -->
  <title>Schedule · MediCore</title>
</head>
<body data-title="Schedule">
<!-- @include portal-start.html -->
<div class="page-header">
  <div><h1>Schedule &amp; availability</h1><p>Set your weekly consultation hours. Existing bookings are not affected.</p></div>
  <div class="page-actions"><button type="button" class="btn btn-primary" id="save"><svg class="icon icon-sm"><use href="#i-save" /></svg>Save schedule</button></div>
</div>
<div data-state="loading" id="schedule">
  <!-- @include load-states.html -->
  <div class="when-ready stack">
    <form class="card card-pad form-grid cols-2" id="settings" data-no-submit>
      <div class="field"><label class="label" for="slot">Appointment slot length</label>
        <select class="input" id="slot" name="slotDurationMinutes"><option value="15">15 minutes</option><option value="20">20 minutes</option><option value="30">30 minutes</option><option value="45">45 minutes</option><option value="60">60 minutes</option></select></div>
      <label class="check card-pad" style="border:1px solid var(--border);border-radius:var(--r);align-self:end">
        <input type="checkbox" name="isAvailableForEmergency" />
        <span><strong>Receive emergency alerts</strong><br /><span class="muted">You'll be notified of emergencies in your departments</span></span>
      </label>
    </form>
    <div class="stack stack-sm stagger" id="days"></div>
  </div>
</div>
<template id="tpl-day">
  <div class="card day-row">
    <div class="day-name"><p class="strong" data-text="name"></p><p class="xsmall muted" data-day-count></p></div>
    <div class="blocks" data-blocks></div>
    <div class="row" style="--gap:0.5rem">
      <button type="button" class="btn btn-secondary btn-sm" data-add><svg class="icon icon-sm"><use href="#i-plus" /></svg>Add hours</button>
      <button type="button" class="btn-icon" data-copy title="Copy to Mon–Fri" aria-label="Copy to Monday to Friday"><svg class="icon icon-sm"><use href="#i-copy" /></svg></button>
    </div>
  </div>
</template>
<template id="tpl-block">
  <div class="block">
    <input class="input" type="time" data-start aria-label="Start time" />
    <span class="muted small">to</span>
    <input class="input" type="time" data-end aria-label="End time" />
    <button type="button" class="btn-icon is-red" data-remove aria-label="Remove block"><svg class="icon icon-sm"><use href="#i-trash-2" /></svg></button>
  </div>
</template>
<!-- @include portal-end.html -->
<script type="module" src="/src/js/pages/doctor/schedule.js"></script>
</body>
</html>
